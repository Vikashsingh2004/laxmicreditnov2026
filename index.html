<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=1200, initial-scale=1.0, minimum-scale=0.2, maximum-scale=5.0, user-scalable=yes" id="viewport-meta" />
    <title>Laxmi Credit - Intelligent Lending Platform</title>
    <script>
      // Automatically enforce desktop view layout on mobile devices
      (function() {
        function enforceDesktopView() {
          var meta = document.getElementById('viewport-meta');
          if (!meta) return;
          var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
                         (('ontouchstart' in window || navigator.maxTouchPoints > 0) && Math.min(window.screen.width, window.screen.height) < 1024);
          var targetDesktopWidth = 1200;

          if (isMobile) {
            var isLandscape = Math.abs(window.orientation || 0) === 90 || 
                              (window.screen.orientation && window.screen.orientation.type && window.screen.orientation.type.includes('landscape'));
            var deviceWidth = isLandscape ? Math.max(window.screen.width, window.screen.height) : Math.min(window.screen.width, window.screen.height);
            if (!deviceWidth || deviceWidth <= 0) deviceWidth = window.screen.width || 390;
            var scale = deviceWidth / targetDesktopWidth;
            meta.setAttribute('content', 'width=' + targetDesktopWidth + ', initial-scale=' + scale.toFixed(4) + ', minimum-scale=0.2, maximum-scale=5.0, user-scalable=yes');
          } else {
            meta.setAttribute('content', 'width=device-width, initial-scale=1.0');
          }
        }
        enforceDesktopView();
        window.addEventListener('orientationchange', enforceDesktopView);
        window.addEventListener('resize', enforceDesktopView);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Mulish:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
